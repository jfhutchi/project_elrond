[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quantbot"
version = "0.1.0"
description = "Safety-first quantitative trading foundation"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.16,<2",
    # Alembic's template dependency: exclude Windows traversal GHSA-5639-2j2p-m4mx.
    "mako>=1.4.2,<2",
    # The operator console (#82). FastAPI because every policy object in this project is already
    # a Pydantic model, so `model_json_schema()` *is* the schema-driven form requirement and
    # OpenAPI makes "explicit, versioned application APIs" true by construction rather than by
    # discipline. Jinja2 renders server-side: no npm, no second lockfile, no Node CI job, and a
    # research store that will outgrow the browser wants pagination rather than virtualisation.
    "fastapi>=0.115,<1",
    "jinja2>=3.1,<4",
    "uvicorn>=0.34,<1",
    "httpx>=0.28,<1",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.11,<3",
    "pyyaml>=6.0,<7",
    "sqlalchemy>=2.0,<3",
    "structlog>=26.1,<27",
    "tzdata>=2025.1",
    "websockets>=15,<18",
]

[project.scripts]
quantbot = "quantbot.cli:main"
quantbot-kronos = "quantbot.forecasting.cli:main"

[dependency-groups]
dev = [
    "hypothesis>=6.165,<7",
    "mypy>=2.3,<3",
    "pytest>=8.4,<10",
    "pytest-asyncio>=1.2,<2",
    "ruff>=0.16.4,<1",
    "types-pyyaml>=6.0,<7",
]
postgres = [
    "psycopg[binary]>=3.2,<4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/quantbot"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
plugins = ["pydantic.mypy"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
