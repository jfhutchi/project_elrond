[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quantbot"
version = "0.1.0"
description = "Safety-first quantitative trading foundation"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.16,<2",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.11,<3",
    "pyyaml>=6.0,<7",
    "sqlalchemy>=2.0,<3",
    "structlog>=25.4,<26",
]

[dependency-groups]
dev = [
    "hypothesis>=6.140,<7",
    "mypy>=1.17,<2",
    "pytest>=8.4,<10",
    "pytest-asyncio>=1.2,<2",
    "ruff>=0.13,<1",
    "types-pyyaml>=6.0,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/quantbot"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
plugins = ["pydantic.mypy"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
