# Index-vol-target V3.0: hold SPY, size it by volatility. NOT DEPLOYED, AND NOT YET CORRECT.
#
# KNOWN DEFECT, measured in the production engine: this config runs at about 9% of
# equity invested, not the 62.5% it was designed for. risk_per_trade_bps of 50 against
# a 2xATR stop caps the position near 8-17% of equity, so the volatility target never
# gets to act. That is the same silent no-op shape cycle 13 found and it means the
# backtest numbers below, which came from a research script that modelled exposure
# directly, DO NOT describe what this file actually does.
#
# The proposed fix DID NOT WORK, and that is worth recording rather than deleting.
# Raising risk_per_trade_bps to 190 and then 300 moved exposure only to 26% and 30%,
# never near 62.5%, and the strategy still returned 0.98% CAGR over 10.6 years. The
# ATR stop-and-exit machinery keeps cutting the position regardless of the caps.
#
# The comparison that matters came out of the same run. The engine's own SPY_SMA200
# benchmark — hold SPY while it is above its 200-day average, nothing else — returns
# 10.34% CAGR at Sharpe 0.91 with a 19.5% drawdown, on 77% average exposure. That is
# the highest Sharpe measured anywhere in this project, it beats this config tenfold,
# and it needs none of this file's machinery.
#
# Conclusion: this config is a dead end. The thing worth deploying, if anything is,
# is the plain 200-day trend rule. Left here as a record of a tested failure.
#
# This exists because cycle 14 measured it as the best option available under this
# project's own risk rules, and an option that only exists as a backtest series is
# not really an option. Sized so max drawdown respects the 15% entry halt:
#
#   SPY + vol target        0.625x   $288.33 per $100   <- this config
#   rotation + vol target   1.000x   $203.92
#   SPY buy-and-hold        0.375x   $178.06
#   10-name rotation        0.500x   $175.99            <- currently deployed
#
# Honest caveat, and it is the reason this is not deployed: the bootstrap 95% CI on
# the gap against the deployed rotation is [-$25.08, +$341.56]. It spans zero. The
# alternative loses in 5.3% of resamples. Suggestive, not established.
#
# What this abandons: the momentum signal entirely. Fourteen research cycles found no
# configuration of that signal which beats holding the index, so this stops paying for
# a prediction and pays only for exposure management. That is a real strategic choice
# and belongs to the operator, not to an agent.
#
# volatility_target_bps: 938 is derived, not tuned. Exposure = equity * target /
# realised volatility, so 0.15 * 0.625 = 0.09375 reproduces 0.625x when SPY realises
# its historical ~15%. In a crisis at 60% realised it holds 0.156x; in calm markets at
# 10% it holds 0.938x. It never borrows: max_gross_exposure_bps caps it at 1.00x.
strategy_name: adaptive-momentum
version: 1.3.0
calendar: XNYS

# A single-name universe. The momentum ranking still runs but has nothing to rank
# against, so it degenerates to "hold SPY when it is above its own trend".
universe:
  - SPY
benchmark_symbol: SPY
regime_symbol: SPY
roster_size: 1

momentum_long: 252
momentum_skip: 21
trend_period: 200
entry_period: 55
exit_period: 20
atr_period: 20
initial_stop_atr: 2
trailing_stop_atr: 3
rotation_frequency: monthly
positive_momentum_required: false  # a single-name universe has no cross-section to rank
market_regime_blocks_entries_only: true

# Risk. The position cap is deliberately loose because volatility targeting is doing the
# sizing here; letting a 10% cap bind would make the vol target inert, which is exactly
# the silent no-op cycle 13 found and recorded.
risk_per_trade_bps: 50
max_open_risk_bps: 10000
max_position_value_bps: 10000
max_gross_exposure_bps: 10000
max_positions: 1
drawdown_thresholds_bps: [500, 1000, 1500, 2000]
drawdown_multipliers_bps: [10000, 7500, 5000, 0, 0]

slippage_bps: 5
commission_per_order: 0
idle_cash_rate_bps: 0
allow_fractional_shares: true
allow_pyramiding: false

volatility_target_bps: 938
volatility_lookback_days: 20

# The asset trend filter stays on: it is the one component measured to carry the highest
# Sharpe of anything in this project (SPY 200d trend, 0.91). Everything else is off.
components:
  momentum: false
  asset_trend: true
  market_regime: false
  donchian_entry: false
  donchian_exit: false
  trailing_stop: false
  roster_exit: false
