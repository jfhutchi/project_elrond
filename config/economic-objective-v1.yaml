# Project Elrond -- deployment economic objective, version 1
#
# WHAT THIS IS. The question the project is trying to answer, frozen before anyone looks at the
# answer. Every experiment here already freezes its own estimand; this freezes the one level
# above it -- which strategy the project would rather deploy -- because that is where metric
# shopping actually happens. SPY buy-and-hold wins on terminal wealth, SPY_SMA200 wins on Sharpe
# and drawdown, vol targeting trades CAGR for drawdown, leverage trades drawdown for CAGR.
# Whether any of those is "better" is not a statistical question until this file answers it.
#
# WHY A FILE AND NOT A TABLE. It is operator policy, so it belongs where the operator can read
# and edit it, in the same shape as the strategy configs beside it. Git makes a change visible
# as a diff; the content hash makes it visible to the code. Both are needed: the requirement is
# that changing the objective creates a new version prospectively and never retroactively
# relabels evidence gathered under the old one.
#
# HOW TO CHANGE IT. Copy to economic-objective-v2.yaml and edit that. Do not edit this file:
# candidates already assessed name this version, and rewriting it under them is exactly the
# retroactive relabelling the versioning exists to prevent.

version: 1

# --------------------------------------------------------------------------------------------
# Status
# --------------------------------------------------------------------------------------------
# PROVISIONAL until the operator ratifies it, and PROVISIONAL is not a formality here.
#
# An earlier version of this file said every value below was transcribed from rules already
# recorded in STATUS.md and CLAUDE.md. That was too strong. Each value is now marked:
#
#   [TRANSCRIBED] the value already exists as a rule elsewhere in this repository; writing it
#                 down here is bookkeeping.
#   [PROPOSED]    an agent picked this number. It is defensible and it is not yet a decision
#                 the operator has made.
#
# STATUS IS PROJECT_DEFAULT, AND THAT IS NOT AN APPROVAL (#72).
#
# These values are frozen and versioned, and the system chose them. That is enough to measure
# evidence against, because what stops metric shopping is freezing the bar *before* the results,
# not signing it -- an agent that cannot edit the criterion after seeing the outcome is as
# constrained by an agent-written bar as by an operator-written one.
#
# What a signature would have told a reader is preserved instead as a label: every artifact
# measured against this objective reports its `authority`, so a qualification claim says in plain
# words that its criteria were chosen by the system rather than accepted by the operator. That is
# strictly more informative than a gate, which only ever said "somebody touched this once".
#
# The earlier design required RATIFIED here and blocked PAPER_QUALIFIED without it. That
# manufactured a deadlock: it also gated LIVE_REVIEW_ELIGIBLE, which is the stage meaning "a human
# should look at this" -- so human review became a prerequisite for its own eligibility.
#
# To ratify: set status to RATIFIED and fill ratified_by and ratified_at. `ratified_by` must be a
# person -- a value that reads as an automated identity is refused at load, and no code path in
# this repository can produce RATIFIED. Ratifying does not change the objective's identity hash,
# so evidence measured against these values stays valid; changing any value above does, and forces
# reassessment.
status: PROJECT_DEFAULT
ratified_by: null
ratified_at: null
authored_by: "claude-opus-5, transcribed from STATUS.md sections 1-2 and CLAUDE.md"
authored_at: "2026-08-22"

# --------------------------------------------------------------------------------------------
# The objective
# --------------------------------------------------------------------------------------------
# Constrained optimisation rather than a weighted score. A score needs coefficients, and
# coefficients nobody can defend are just metric shopping with extra arithmetic.
#
#   maximise net benchmark-relative growth
#   subject to the hard constraints below
#
# [PROPOSED] BENCHMARK_RELATIVE_GROWTH, not TERMINAL_WEALTH: the project's own record is that
# the deployed rotation is beta 0.71 with alpha t=0.05, and a fractional SPY position reproduces
# it to 0.05 CAGR points, so on terminal wealth alone holding more index reads as an improvement.
# That argument is good and it does not settle the question. A drawdown-constrained growth
# objective is the obvious alternative and the operator may well prefer it: this file expresses
# the drawdown limit as a hard constraint rather than as part of what is being maximised, and
# which of those two shapes is right is a decision about risk appetite, not about statistics.
objective: BENCHMARK_RELATIVE_GROWTH

# [TRANSCRIBED] SPY. The benchmark every measurement in REFUTED.md is already against, and the
# simplest thing the operator could do instead of running any of this.
benchmark_symbol: SPY

# The simplest strategy satisfying the same mandate, which a complex one has to beat by a
# meaningful margin before the complexity has earned anything. Named here so it cannot be
# swapped for an easier comparison later.
simplest_compliant_baseline: "SPY buy-and-hold, sized to the drawdown constraint"

# --------------------------------------------------------------------------------------------
# Hard constraints. A candidate violating any of these is not compared on return at all.
# --------------------------------------------------------------------------------------------
# The live paper account. Capacity is judged against the range, not the current balance:
# an edge that exists only at $100 of notional is not an edge worth the machinery.
# [TRANSCRIBED] the live paper account balance.
target_capital_usd: 100
# [PROPOSED] nothing in the repository fixes the upper end. The number matters because capacity
# is judged against the range rather than the current balance -- an edge that exists only at $100
# of notional is not an edge worth the machinery -- so the operator's real intent should replace
# this before anything is qualified against it.
intended_capital_range_usd: [100, 10000]

# [TRANSCRIBED] everything the broker integration and the data providers actually support.
permitted_asset_classes: [US_EQUITY, US_ETF]

# [TRANSCRIBED] the deployed risk ladder: entry halts at 15%, liquidation at 20%. The constraint
# is the entry halt, because a strategy that reaches it stops being able to earn the drawdown
# back -- STATUS.md records that the halt has no exit.
max_drawdown_bps: 1500

# [TRANSCRIBED] Reg T caps initial equity leverage at 2x; the drawdown rule caps it near 1x; and
# constant leverage above ~3.5x measured bankrupt (REFUTED.md). Long-only, unlevered.
max_gross_exposure_bps: 10000
max_leverage: 1.0

# --------------------------------------------------------------------------------------------
# What "meaningfully better" means, frozen before anything is compared
# --------------------------------------------------------------------------------------------
# [PROPOSED] 100bps a year of benchmark-relative return. The *need* for some threshold is not a
# policy choice -- without one, any difference is meaningful and the comparison is unfalsifiable
# -- but the level is, and this level is an agent's guess at what would be worth the operational
# risk of running an autonomous system. It has to be written down before a candidate is measured
# or it becomes whatever the candidate scored; it also has to be the operator's number.
minimum_meaningful_improvement_bps: 100

# [PROPOSED] turnover has to pay for itself, but 12 round trips a year is an agent's cap and not
# a rule this repository records anywhere. The deployed rotation's own turnover was never
# measured against it.
max_annual_turnover: 12
# [TRANSCRIBED] the deployed cost model charges 5bps per side pending a real slippage sample
# (n>=30). Measured NBBO on this universe is ~1.1bps median, so this is conservative on purpose.
assumed_round_trip_cost_bps: 10.0

# [PROPOSED] long enough that a single regime cannot decide the answer -- but "long enough" is a
# judgement about how much of the operator's patience an unproven system is owed, not a fact.
evaluation_horizon_years: 3

# Not modelled. Recorded so that "tax was not considered" is a stated scope limit rather than
# something a reader has to notice is missing.
tax_treatment: NOT_MODELLED
