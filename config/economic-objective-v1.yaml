# Project Elrond -- deployment economic objective, version 1
#
# WHAT THIS IS. The question the project is trying to answer, frozen before anyone looks at the
# answer. Every experiment here already freezes its own estimand; this freezes the one level
# above it -- which strategy the project would rather deploy -- because that is where metric
# shopping actually happens. SPY buy-and-hold wins on terminal wealth, SPY_SMA200 wins on Sharpe
# and drawdown, vol targeting trades CAGR for drawdown, leverage trades drawdown for CAGR.
# Whether any of those is "better" is not a statistical question until this file answers it.
#
# WHY A FILE AND NOT A TABLE. It is operator policy, so it belongs where the operator can read
# and edit it, in the same shape as the strategy configs beside it. Git makes a change visible
# as a diff; the content hash makes it visible to the code. Both are needed: the requirement is
# that changing the objective creates a new version prospectively and never retroactively
# relabels evidence gathered under the old one.
#
# HOW TO CHANGE IT. Copy to economic-objective-v2.yaml and edit that. Do not edit this file:
# candidates already assessed name this version, and rewriting it under them is exactly the
# retroactive relabelling the versioning exists to prevent.

version: 1

# --------------------------------------------------------------------------------------------
# Status
# --------------------------------------------------------------------------------------------
# PROVISIONAL until the operator ratifies it. The values below are not invented: every one is
# transcribed from rules already recorded in STATUS.md and CLAUDE.md, which is why freezing them
# is bookkeeping rather than a policy decision an agent made. But transcription is not
# ratification, and the difference decides whether a candidate may be presented for human
# live review -- so it is a field rather than a footnote.
status: PROVISIONAL
ratified_by: null
ratified_at: null
authored_by: "claude-opus-5, transcribed from STATUS.md sections 1-2 and CLAUDE.md"
authored_at: "2026-08-22"

# --------------------------------------------------------------------------------------------
# The objective
# --------------------------------------------------------------------------------------------
# Constrained optimisation rather than a weighted score. A score needs coefficients, and
# coefficients nobody can defend are just metric shopping with extra arithmetic.
#
#   maximise net benchmark-relative growth
#   subject to the hard constraints below
#
# BENCHMARK_RELATIVE_GROWTH, not TERMINAL_WEALTH: the project's own record is that the deployed
# rotation is beta 0.71 with alpha t=0.05, and a fractional SPY position reproduces it to 0.05
# CAGR points. Judged on terminal wealth alone, holding more index reads as an improvement.
objective: BENCHMARK_RELATIVE_GROWTH

# SPY. It is the benchmark every measurement in REFUTED.md is already against, and it is the
# simplest thing the operator could do instead of running any of this.
benchmark_symbol: SPY

# The simplest strategy satisfying the same mandate, which a complex one has to beat by a
# meaningful margin before the complexity has earned anything. Named here so it cannot be
# swapped for an easier comparison later.
simplest_compliant_baseline: "SPY buy-and-hold, sized to the drawdown constraint"

# --------------------------------------------------------------------------------------------
# Hard constraints. A candidate violating any of these is not compared on return at all.
# --------------------------------------------------------------------------------------------
# The live paper account. Capacity is judged against the range, not the current balance:
# an edge that exists only at $100 of notional is not an edge worth the machinery.
target_capital_usd: 100
intended_capital_range_usd: [100, 10000]

permitted_asset_classes: [US_EQUITY, US_ETF]

# The deployed risk ladder: entry halts at 15%, liquidation at 20%. The constraint is the entry
# halt, because a strategy that reaches it stops being able to earn the drawdown back --
# STATUS.md records that the halt has no exit.
max_drawdown_bps: 1500

# Reg T caps initial equity leverage at 2x; the drawdown rule caps it near 1x; and constant
# leverage above ~3.5x measured bankrupt. Long-only, unlevered.
max_gross_exposure_bps: 10000
max_leverage: 1.0

# --------------------------------------------------------------------------------------------
# What "meaningfully better" means, frozen before anything is compared
# --------------------------------------------------------------------------------------------
# 100bps a year of benchmark-relative return. Below that the comparison is not worth the
# operational risk of running an autonomous system at all, and the number has to be written
# down before a candidate is measured or it becomes whatever the candidate scored.
minimum_meaningful_improvement_bps: 100

# Turnover has to pay for itself. Measured NBBO on this universe is ~1.1bps median, and the
# deployed cost model still charges 5bps per side pending a real slippage sample (n>=30).
max_annual_turnover: 12
assumed_round_trip_cost_bps: 10.0

# Long enough that a single regime cannot decide the answer.
evaluation_horizon_years: 3

# Not modelled. Recorded so that "tax was not considered" is a stated scope limit rather than
# something a reader has to notice is missing.
tax_treatment: NOT_MODELLED
