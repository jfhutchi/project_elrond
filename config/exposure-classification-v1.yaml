# Exposure classification for the traded universe (#59, slice 1).
#
# TWO KINDS OF CLAIM, KEPT APART, because they carry different evidence.
#
# `mandate` is what a fund *is*, read off the issuer's own material. XLK's technology exposure is
# the Technology Select Sector SPDR's published mandate; it is definitional, needs no vendor and
# no licence, and does not get revised.
#
# `factor_model` is what a fund *behaves like* under stress. HYG's equity beta in a drawdown is
# real and is the reason a concentration limit should see it -- but it is an empirical claim,
# assigned by a declared method with no fitted parameters, and it must not borrow the authority
# of a prospectus. It carries its own method, as-of date and version so a later study (#57) can
# say exactly which mechanism a veto used.
#
# PROVENANCE IS A PROPERTY OF THE ASSIGNMENT, NOT OF THE GROUP. `US_EQUITY` is a mandate claim for
# SPY and a factor claim for HYG. The same group name means the same exposure either way; what
# differs is how much evidence stands behind saying this instrument has it.
#
# WHAT `effective_from` MEANS. The earliest decision date these mandates can be applied to.
# Classification is refused for anything earlier, and that refusal blocks.
#
# It is set to the month after Communication Services was created in the S&P sector scheme, which
# is the last event that materially changed what these funds hold -- constituents left XLK and XLY
# then, so a 2017 portfolio scored against today's XLK would be judged on a composition that did
# not exist. Rounded forward to a month boundary on purpose: if the exact changeover date is off
# by days, being late refuses more, and refusing more is the safe direction here.
#
# THIS REPLACED A VERIFICATION DATE. The first version used the date the table was written
# (2026-08-27), to avoid researching per-fund history at all. That was defensible while the veto
# shipped disabled. Once #75 enabled it, the same choice refused every decision dated earlier --
# every replay, every backtest, and the wired-cycle integration test -- because the table declined
# to speak about any history whatsoever. One documented sector reshuffle is a smaller claim than
# 23 inception dates and buys back the entire usable period.
#
# A SYMBOL MAY CARRY MORE THAN ONE EXPOSURE and counts in each. Concentration is measured per
# group, which can only ever make the veto more likely to refuse. A single-group table would rate
# SPY + QQQ + XLK + IWM + MDY as five uncorrelated exposures, which is the failure the veto exists
# to catch.
#
# UNLISTED SYMBOLS ARE UNKNOWN, AND UNKNOWN BLOCKS. An unclassified instrument belongs to no group
# and would therefore add to no group's concentration, passing every limit by being unrecognised.
# That is the fail-open direction, so it rejects instead.

version: 2
source: "Issuer fund descriptions (State Street Select Sector SPDRs, Invesco, iShares, Vanguard)"
effective_from: 2018-10-01

# What each fund holds, by its published mandate.
mandate:
  # Broad US equity.
  SPY: [US_EQUITY]
  IWM: [US_EQUITY]
  MDY: [US_EQUITY]
  # The Nasdaq-100 mandate is the largest non-financial Nasdaq listings. It is US equity by
  # mandate; its technology weight is a consequence, not a stated objective, so that claim moves
  # to the factor model below.
  QQQ: [US_EQUITY]

  # Non-US equity.
  EFA: [INTERNATIONAL_EQUITY]
  EEM: [EMERGING_EQUITY]

  # US sector equity. Each is US equity as well as its sector -- a roster of nine sector SPDRs is
  # the index with extra steps -- and both halves are definitional here.
  XLB: [US_EQUITY, MATERIALS]
  XLE: [US_EQUITY, ENERGY]
  XLF: [US_EQUITY, FINANCIALS]
  XLI: [US_EQUITY, INDUSTRIALS]
  XLK: [US_EQUITY, TECHNOLOGY]
  XLP: [US_EQUITY, CONSUMER_STAPLES]
  XLU: [US_EQUITY, UTILITIES]
  XLV: [US_EQUITY, HEALTH_CARE]
  XLY: [US_EQUITY, CONSUMER_DISCRETIONARY]

  # Real assets.
  VNQ: [REAL_ESTATE]
  DBC: [COMMODITY]
  GLD: [PRECIOUS_METAL]

  # Rates. These hold US Treasury securities, which is a statement about the issuer of what is in
  # the fund. Interest-rate sensitivity is a behaviour and lives in the factor model.
  TLT: [TREASURY]
  IEF: [TREASURY]
  TIP: [TREASURY, INFLATION_LINKED]

  # Credit. LQD and HYG hold corporate bonds; neither holds Treasuries, so neither carries a
  # Treasury mandate however rate-sensitive it is.
  LQD: [CREDIT]
  HYG: [CREDIT]

# What each fund behaves like under stress. Empirical, declared rather than fitted, and versioned
# separately because it is a weaker kind of claim than the block above.
factor_model:
  method: "declared stress proxy: documented behaviour under drawdown, no fitted parameters"
  as_of: 2026-08-27
  version: 1
  assignments:
    # Rate sensitivity. Long Treasuries, intermediate Treasuries, TIPS and investment-grade
    # credit all move with rates; that is duration, and it is why a book of TLT + IEF + LQD is
    # more concentrated than three separate mandates suggest.
    TLT: [DURATION_FACTOR]
    IEF: [DURATION_FACTOR]
    TIP: [DURATION_FACTOR]
    LQD: [DURATION_FACTOR]

    # The contested one, and the reason this section exists. High yield is credit by mandate and
    # equity beta in a drawdown -- precisely when a concentration limit matters. Recording it as
    # a factor keeps the risk visible without asserting that HYG holds equities.
    HYG: [US_EQUITY]

    # The Nasdaq-100's technology weight, which is a property of what the index has come to hold
    # rather than of what it is mandated to hold.
    QQQ: [TECHNOLOGY]
