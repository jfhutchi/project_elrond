# Adaptive-momentum V1.3: V1.2 plus volatility-targeted position sizing.
#
# Why this version exists, stated precisely because the wider claim would be false.
#
# V1.2's historical max drawdown is 26.4%. Its own halt fires at 20%. The deployed
# configuration is therefore inconsistent with its own risk rule: it is expected to
# trip the halt, and cycle 11 measured that a halt with a human-speed resumption
# delay costs 8-20% of terminal wealth. Volatility targeting at a 1.5% per-position
# target brings the drawdown to 17.1%, inside the rule.
#
# What is established: volatility targeting reduces drawdown. Cycle 11 measured this
# across 18 assets, 16 of 18 reduced, p=0.0007.
#
# What is NOT established: that it makes more money. At matched 1.0x exposure with the
# halt enforced at a realistic 21-day resumption it gained $15.88 per $100, and the
# bootstrap 95% CI on that gap is [-$86.76, +$76.79] — it loses in 36.8% of resamples.
# Cycle 13. Do not justify this version by returns.
#
# Inherited from V1.2: fractional shares, and the component set measured best among
# live-expressible configurations. The Donchian entry gate and ATR trailing stop stay
# disabled; cycles 1-5 measured them holding exposure near 19% and destroying the
# momentum signal.
strategy_name: adaptive-momentum
version: 1.3.0
calendar: XNYS

# Proposed versioned universe and benchmark defaults.
universe:
  - SPY
  - QQQ
  - IWM
  - MDY
  - EFA
  - EEM
  - VNQ
  - XLB
  - XLE
  - XLF
  - XLI
  - XLK
  - XLP
  - XLU
  - XLV
  - XLY
  - DBC
  - GLD
  - TLT
  - IEF
  - TIP
  - LQD
  - HYG
benchmark_symbol: SPY
regime_symbol: SPY
roster_size: 10

# Proposed versioned signal and risk defaults.
momentum_long: 252
momentum_skip: 21
trend_period: 200
entry_period: 55
exit_period: 20
atr_period: 20
initial_stop_atr: 2
trailing_stop_atr: 3
rotation_frequency: monthly
positive_momentum_required: true
market_regime_blocks_entries_only: true

# Proposed versioned portfolio-risk defaults, expressed in basis points.
risk_per_trade_bps: 50
max_open_risk_bps: 500
max_position_value_bps: 1000
max_gross_exposure_bps: 10000
max_positions: 20
drawdown_thresholds_bps: [500, 1000, 1500, 2000]
drawdown_multipliers_bps: [10000, 7500, 5000, 0, 0]

# Proposed versioned execution and accounting assumptions.
slippage_bps: 5  # Applied on each side.
commission_per_order: 0
idle_cash_rate_bps: 0
allow_fractional_shares: true
allow_pyramiding: false

# Volatility-targeted sizing. Exposure per name scales as target/realised volatility,
# still capped by max_position_value_bps.
#
# 150bps is a deliberate choice and the sweep matters: at a 1500bps (15%) target this
# NEVER binds, because min(10% weight cap, 0.15/vol) only prefers the vol term above
# 150% annualised volatility, which these ETFs never reach. A 15% target would ship a
# silent no-op. 150bps binds; 100bps over-damps and gives back return.
volatility_target_bps: 150
volatility_lookback_days: 20

# Which signal gates are active. Defaults are all-enabled; this version deliberately
# disables the two that research measured as harmful.
components:
  momentum: true
  asset_trend: true
  market_regime: false
  donchian_entry: false
  donchian_exit: false
  trailing_stop: false
  roster_exit: true
