# The independent merge gate (#49).
#
# Every number this project publishes about its own software has so far been self-reported by
# the agent that wrote the code. The repository's governing rule is that a gate must not trust
# the party that benefits from it passing, and "1,332 tests pass" was the last claim still
# exempt from it. This runs the same three commands somewhere the author does not control.
#
# No secrets are referenced anywhere in this file. That is deliberate and load-bearing: the
# suite must be incapable of reaching a broker, so it is never handed the means to.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    # Both, and the first run proved why rather than assumed it. `mypy src` was reported clean
    # for months; on Linux it fails with seven errors, because `msvcrt.locking` and
    # `ctypes.windll` are Windows-only symbols behind `os.name`/`platform.system()` guards that
    # mypy does not narrow. The claim was true on the author's machine and nowhere else. Elrond
    # runs on Windows (the coordinator) and Linux (the Pi, WSL2), so one runner checks one half.
    #
    # The required status checks to protect `main` with are "checks (ubuntu-latest)" and
    # "checks (windows-latest)".
    name: checks
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 30
    env:
      # `QUANTBOT_LIVE_TRADING: "false"` stood here until 2026-09-03, under a comment saying a
      # test reaching for real credentials should fail loudly rather than find some. It
      # configured nothing: `Settings` reads `TRADING_MODE` and `LIVE_TRADING_ACKNOWLEDGED` with
      # `extra="ignore"`, so that name was discarded on arrival. The same defect was in
      # `deploy/omen/setup.sh`'s guard, and finding it here too is worse -- this file exists to
      # be the check that does not trust the party it judges.
      #
      # These are the settings the code actually reads, and they restate the defaults rather
      # than adding protection. **What makes the suite incapable of reaching a broker is that
      # this workflow references no secrets at all**, which is a property of the file and not of
      # its environment block. Pinned anyway, so a runner with something inherited in its
      # environment cannot quietly change what the suite runs as.
      TRADING_MODE: PAPER
      BROKER_ENVIRONMENT: PAPER
      LIVE_TRADING_ACKNOWLEDGED: "false"
      KILL_SWITCH: "true"
      UV_LINK_MODE: copy
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      # --frozen, so a lockfile that no longer matches pyproject.toml is a failure rather than
      # a silent resolution against something nobody reviewed.
      - name: Sync the locked environment
        run: uv sync --frozen --group dev

      - name: Lint
        run: uv run ruff check src tests

      # Both platforms from every runner. `mypy` analyses only the host's half of a
      # `sys.platform` branch, so a single-platform type-check silently exempts the other -- the
      # defect this file's first run found, and then again in the opposite direction when the
      # fix was written. Two commands make each runner prove both halves.
      - name: Type-check (linux)
        run: uv run mypy --platform linux src

      - name: Type-check (windows)
        run: uv run mypy --platform win32 src

      - name: Test
        run: uv run pytest

      # A suite that writes into the working tree has state it did not declare, and the next
      # run is no longer starting where this one did.
      - name: The suite left the tree clean
        shell: bash
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "the test run modified tracked or untracked files:"
            git status --porcelain
            exit 1
          fi
