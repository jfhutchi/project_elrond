name: Temporary sandbox verification

on:
  push:
    branches:
      - fix/sandbox-package-path-isolation
  pull_request:
    branches:
      - elrond-v0.2

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run pytest tests/
      - run: uv run ruff check .
      - run: uv run mypy src/quantbot/sandbox/runner.py
      - name: Mutation-check sandbox path guards
        shell: python
        run: |
          from pathlib import Path
          import subprocess

          runner = Path("src/quantbot/sandbox/runner.py")
          python = Path(".venv/Scripts/python.exe")

          def check(label, replacements, tests, needles):
              original = runner.read_text(encoding="utf-8")
              mutated = original
              try:
                  for old, new, expected_count in replacements:
                      actual_count = mutated.count(old)
                      if actual_count != expected_count:
                          raise AssertionError(
                              f"{label}: expected {expected_count} replacement(s), got {actual_count}"
                          )
                      mutated = mutated.replace(old, new)
                  runner.write_text(mutated, encoding="utf-8")
                  result = subprocess.run(
                      [str(python), "-m", "pytest", *tests, "-q"],
                      capture_output=True,
                      text=True,
                      check=False,
                  )
              finally:
                  runner.write_text(original, encoding="utf-8")
              output = result.stdout + result.stderr
              if result.returncode == 0:
                  raise AssertionError(f"{label}: mutation survived")
              missing = [needle for needle in needles if needle not in output]
              if missing:
                  raise AssertionError(f"{label}: missing expected failures {missing}\n{output}")
              print(f"{label}: rejected as expected")
              print(output)

          test_file = "tests/unit/sandbox/test_runner_paths.py"
          check(
              "bytecode source path",
              [("            ignore=_PACKAGE_COPY_IGNORE,\n", "", 2)],
              [f"{test_file}::test_cached_repository_bytecode_is_not_staged"],
              ["cached bytecode from the repository package was staged"],
          )
          check(
              "editable location metadata",
              [
                  (
                      '        if lowered == "__pycache__" or lowered.startswith("__editable__"):\n',
                      '        if lowered == "__pycache__":\n',
                      1,
                  ),
                  (
                      '_UNSAFE_STAGING_SUFFIXES = frozenset({".egg-link", ".pth", ".pyc", ".pyo"})',
                      '_UNSAFE_STAGING_SUFFIXES = frozenset({".pth", ".pyc", ".pyo"})',
                      1,
                  ),
              ],
              [f"{test_file}::test_parent_install_location_metadata_is_not_staged"],
              ["parent-install location metadata containing the repository path was staged"],
          )
          check(
              "editable transitive dependency",
              [
                  (
                      '    import_roots = dict.fromkeys(\n'
                      '        (*policy.allowed_third_party, *_distribution_import_roots(distributions))\n'
                      '    )\n',
                      '    import_roots = dict.fromkeys(policy.allowed_third_party)\n',
                      1,
                  ),
              ],
              [f"{test_file}::test_editable_runtime_dependency_is_staged_from_its_import_root"],
              ["ModuleNotFoundError", "sandbox_editable_dependency"],
          )
          check(
              "shared namespace ownership",
              [("        if unselected:\n", "        if False and unselected:\n", 1)],
              [
                  f"{test_file}::test_shared_dependency_namespace_fails_closed_before_unapproved_sibling_is_staged"
              ],
              ["DID NOT RAISE", "SandboxError"],
          )
