<style>
  :root {
    color-scheme: light;
    --bg:#f3f3ef; --panel:#fff; --panel-2:#eeefea; --line:#dddeda;
    --ink:#202723; --ink-dim:#525c56; --ink-faint:#68736c; --accent:#345e4b;
    --ok:#2d654c; --warn:#8c641e; --crit:#a43c3c; --absent:#727a74;
    --radius:4px; --gap:16px;
    --mono:"Cascadia Code","SFMono-Regular",Consolas,monospace;
    --sans:"Segoe UI",-apple-system,BlinkMacSystemFont,Arial,sans-serif;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.5 var(--sans); }
  a { color:var(--accent); text-decoration:none; }
  a:hover { text-decoration:underline; }
  a,button,input,select,summary { -webkit-tap-highlight-color:transparent; }
  :focus-visible { outline:2px solid #497d64; outline-offset:3px; }
  button,input,select,textarea { font:inherit; }
  button,input[type=submit],.button {
    color:var(--ink); background:#fff; border:1px solid #c5cbc5; border-radius:3px;
    padding:8px 13px; font-weight:600; cursor:pointer;
  }
  button:hover,.button:hover { background:#f0f3ef; border-color:#8d9b90; text-decoration:none; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  input:not([type=checkbox]):not([type=radio]),select,textarea {
    max-width:100%; color:var(--ink); background:#fff; border:1px solid #c5cbc5;
    border-radius:3px; padding:8px 10px;
  }
  pre { overflow:auto; padding:16px; border:1px solid var(--line); background:var(--panel); }
  code { overflow-wrap:anywhere; font-family:var(--mono); font-size:.9em; }
  .strip {
    position:sticky; top:0; z-index:20; min-height:42px; display:flex; gap:10px;
    align-items:center; flex-wrap:wrap; padding:9px 24px; border-bottom:1px solid var(--line);
    background:#fff; font-size:11px; color:var(--ink-dim);
  }
  .strip .tag { font-size:10px; font-weight:700; letter-spacing:.07em; }
  .strip .quiet { font-size:11px; }
  .strip--danger { background:#fff0ef; border-bottom:2px solid var(--crit); }
  .shell { display:grid; grid-template-columns:184px minmax(0,1fr); min-height:calc(100vh - 42px); }
  .workspace-nav {
    position:sticky; top:42px; height:calc(100vh - 42px); overflow-y:auto;
    background:#202723; color:#bdc4be; padding:28px 12px 20px;
  }
  .brand { display:flex; align-items:center; gap:11px; padding:0 12px 28px; }
  .brand-mark { display:grid; place-items:center; width:29px; height:29px;
    border:1px solid #718077; font-size:17px; font-weight:600; color:#e8ece6; }
  .brand strong { display:block; color:#f1f3ee; font-weight:600; font-size:16px; letter-spacing:.02em; }
  .brand small { display:block; font-size:10px; color:#9ba89f; letter-spacing:.05em; }
  .nav-group { margin-bottom:22px; }
  .nav-disclosure > summary { display:none; }
  .nav-label { padding:0 12px 7px; color:#a6b1a8; font-size:9px; font-weight:600;
    text-transform:uppercase; letter-spacing:.12em; }
  .workspace-nav a { display:flex; align-items:center; min-height:33px; padding:6px 12px;
    margin:2px 0; border-radius:3px; color:#c1cac3; font-size:12px; }
  .workspace-nav a:hover { background:#2c3730; color:#fff; text-decoration:none; }
  .workspace-nav a.on { color:#fff; background:#39483e; font-weight:600; }
  .workspace-nav a.on::after { content:""; width:4px; height:4px; background:#c3d4c5;
    margin-left:auto; border-radius:50%; }
  .nav-foot { margin:28px 12px 0; padding-top:14px; border-top:1px solid #3e4a42;
    color:#a6b1a8; font-size:10px; line-height:1.8; }
  main { min-width:0; width:100%; max-width:1600px; padding:32px 36px 28px; }
  h1 { font-size:25px; line-height:1.25; letter-spacing:-.025em; font-weight:600; margin:0 0 8px; }
  h2 { font-size:14px; color:var(--ink); font-weight:600; margin:27px 0 12px; }
  h3 { font-size:13px; font-weight:600; }
  .sub { font-size:12px; color:var(--ink-faint); margin:0 0 25px; max-width:78ch; }
  .quiet { font-size:12px; color:var(--ink-faint); }
  .mono,td.mono { font-family:var(--mono); font-size:11px; font-variant-numeric:tabular-nums; }
  .absent { color:var(--absent); font-style:normal; }
  .grid { display:grid; gap:var(--gap); grid-template-columns:repeat(auto-fit,minmax(215px,1fr)); }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:18px; }
  .card h2:first-child { margin-top:0; }
  main > .card + .card { margin-top:16px; }
  main > .scroll { background:#fff; border:1px solid var(--line); border-radius:4px; }
  .card .k { color:var(--ink-faint); font-size:10px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; }
  .card .v { font-size:25px; line-height:1.25; font-weight:500; margin-top:9px; font-variant-numeric:tabular-nums; letter-spacing:-.02em; }
  .card .n { color:var(--ink-faint); font-size:11px; line-height:1.6; margin-top:7px; }
  .card .v.absent { font-size:17px; font-weight:400; }
  table { width:100%; border-collapse:collapse; font-size:12px; }
  .scroll { max-width:100%; overflow-x:auto; }
  th,td { text-align:left; padding:10px 12px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { background:#f7f8f5; color:var(--ink-faint); font-size:9px; font-weight:600;
    text-transform:uppercase; letter-spacing:.07em; white-space:nowrap; }
  tr:last-child td { border-bottom:0; }
  tbody tr:hover td { background:#fafbf8; }
  td { font-variant-numeric:tabular-nums; }
  .numeric { text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums; }
  .pill { display:inline-block; border-radius:3px; padding:3px 6px; font-size:9px;
    font-weight:600; letter-spacing:.035em; vertical-align:middle; line-height:1.4; }
  .pill--ok { color:var(--ok); background:#e8f1e9; }
  .pill--warn { color:var(--warn); background:#f7efd9; }
  .pill--crit { color:var(--crit); background:#fae9e7; }
  .pill--absent { color:#69736b; background:#edf0eb; }
  .attention { list-style:none; margin:0; padding:0; }
  .attention li { font-size:11px; color:#6e512c; border-bottom:1px solid #e9dfcd; padding:8px 0; }
  .attention li:last-child { border:0; }
  .attention-panel { border-left:3px solid #aa813b; background:#fcfaf4; padding:13px 18px; margin:18px 0 23px; }
  .attention-panel h2 { margin:0 0 2px; font-size:11px; color:#71532a; }
  .page-heading { display:flex; align-items:flex-start; justify-content:space-between; gap:20px; margin-bottom:24px; }
  .page-heading .sub { margin-bottom:0; }
  .eyebrow { color:var(--ink-faint); font-size:9px; font-weight:600; letter-spacing:.12em;
    text-transform:uppercase; margin:0 0 9px; }
  .snapshot-time { color:var(--ink-faint); font-size:10px; white-space:nowrap; padding-top:5px; }
  .metric-strip { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); border:1px solid var(--line);
    background:#fff; border-radius:4px; margin-bottom:20px; }
  .metric-strip .card { border:0; border-right:1px solid var(--line); border-radius:0; padding:19px 20px; background:none; }
  .metric-strip .card:last-child { border-right:0; }
  .metric-strip .v .pill { font-size:11px; padding:4px 7px; }
  .overview-layout { display:grid; grid-template-columns:minmax(0,1fr) 280px; gap:20px; align-items:start; }
  .overview-main,.overview-aside { min-width:0; display:grid; gap:20px; }
  .table-panel { background:#fff; border:1px solid var(--line); border-radius:4px; overflow:hidden; }
  .panel-heading { display:flex; justify-content:space-between; align-items:center; gap:12px;
    padding:15px 18px; border-bottom:1px solid var(--line); }
  .panel-heading h2 { margin:0; font-size:12px; }
  .panel-heading a,.panel-heading span { font-size:10px; color:var(--ink-faint); }
  .table-panel .empty { padding:30px 18px; color:var(--ink-faint); font-size:12px; }
  .table-panel .table-note { padding:10px 18px; border-top:1px solid var(--line); margin:0; font-size:10px; color:var(--ink-faint); }
  .ticker { font-weight:600; letter-spacing:.02em; }
  .role-list { margin:17px 0 4px; }
  .role-row { display:flex; justify-content:space-between; gap:10px; padding:9px 0; border-top:1px solid var(--line); font-size:11px; }
  .role-row .quiet { font-size:10px; }
  .role-row .role-name { text-transform:capitalize; }
  .disclosure { margin-top:23px; border:1px solid var(--line); border-radius:4px; background:#fff; }
  .disclosure > summary { padding:13px 17px; cursor:pointer; font-size:12px; font-weight:600; }
  .disclosure > summary small { margin-left:8px; font-size:10px; font-weight:400; color:var(--ink-faint); }
  .disclosure > .disclosure-body { border-top:1px solid var(--line); padding:18px; }
  .disclosure .card { margin-bottom:12px; }
  .disclosure .scroll { margin-top:0; }
  .identifier { overflow-wrap:anywhere; max-width:28ch; }
  .identifier > summary { cursor:pointer; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:24ch; }
  .identifier[open] > summary { white-space:normal; }
  .identifier .identifier-value { display:block; padding-top:6px; }
  details.hint { display:inline-block; margin-top:4px; }
  details.hint > summary { cursor:pointer; color:var(--ink-faint); }
  details.hint > p { font-size:12px; max-width:60ch; color:var(--ink-faint); }
  dl { margin:12px 0; }
  dt { color:var(--ink-faint); font-size:11px; }
  dd { margin:3px 0 12px; font-size:12px; overflow-wrap:anywhere; }
  footer { margin-top:30px; padding-top:15px; border-top:1px solid var(--line); color:var(--ink-faint); font-size:10px; }
  @media (min-width:1550px) { main { padding:36px 48px; } .overview-layout { grid-template-columns:minmax(0,1fr) 320px; } }
  @media (max-width:1100px) { main { padding:26px 24px; } .overview-layout { grid-template-columns:minmax(0,1fr); } .overview-aside { grid-template-columns:repeat(2,minmax(0,1fr)); } }
  @media (max-width:760px) {
    .strip { position:relative; padding:9px 16px; gap:7px; }
    .strip .boundary-note { display:none; }
    .shell { display:block; }
    .workspace-nav { position:relative; top:0; height:auto; padding:14px 16px; display:block; }
    .brand { width:100%; padding:0; }
    .brand small { display:none; }
    .nav-disclosure > summary { display:block; position:absolute; top:18px; right:17px;
      color:#e8ece6; font-size:11px; cursor:pointer; border:1px solid #657467; padding:4px 8px; border-radius:3px; }
    .nav-links { display:flex; flex-wrap:wrap; gap:2px 10px; padding-top:13px; }
    .nav-group { display:contents; }
    .nav-label,.nav-foot { display:none; }
    .workspace-nav a { font-size:11px; padding:5px 7px; min-height:30px; }
    .workspace-nav a.on::after { display:none; }
    main { padding:24px 16px; }
    .metric-strip { grid-template-columns:repeat(2,minmax(0,1fr)); }
    .metric-strip .card { padding:16px; border-bottom:1px solid var(--line); }
    .metric-strip .card:nth-child(2) { border-right:0; }
    .metric-strip .card:nth-child(n+3) { border-bottom:0; }
    .overview-aside { grid-template-columns:1fr; }
    .page-heading { display:block; }
    .snapshot-time { padding-top:12px; }
    .grid { grid-template-columns:minmax(0,1fr); }
    h1 { font-size:23px; }
  }
</style>
